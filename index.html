<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golden Bot v3.0 Command Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#050816; --card:#0a1122cc; --accent:#00f5ff; --accent2:#7c3aed; --text:#e5e7eb; --muted:#94a3b8;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --radius:16px;
}
*{box-sizing:border-box;font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent;}
body{background:radial-gradient(1200px 800px at 80% -10%, #7c3aed22, transparent), radial-gradient(800px 600px at 0% 100%, #00f5ff11, transparent), var(--bg); color:var(--text); margin:0; padding:16px; min-height:100vh;}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header h1{font-size:20px;margin:0;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo{width:36px;height:36px}

.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid #1e293b; border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:0 0 0 1px #ffffff05}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.grid-3{grid-template-columns:repeat(3,1fr)} .grid-2{grid-template-columns:repeat(2,1fr)}}

input,textarea,button,select{width:100%;padding:12px;border-radius:12px;border:1px solid #233044;background:#0b1220;color:#fff;font-size:14px;margin-top:6px;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #00f5ff22}
button{background:linear-gradient(90deg,var(--accent2),var(--accent));border:none;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:scale(.98)}
.btn-secondary{background:#1e293b;border:1px solid #334155}
.btn-danger{background:linear-gradient(90deg,#ef4444,#f87171)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;background:#0b1220;border:1px solid #233044;margin:4px 4px 0 0;font-size:12px}
.logs,.chat{height:300px;overflow:auto;background:#03060e;border:1px solid #1e293b;padding:12px;border-radius:12px;font-size:13px}
.msg-user{background:#1e3a8a30;border-left:3px solid var(--accent);padding:10px;border-radius:8px;margin:6px 0}
.msg-bot{background:#1f293730;border-left:3px solid var(--accent2);padding:10px;border-radius:8px;margin:6px 0}
.captcha-img{max-width:100%;border:1px solid #334155;border-radius:12px}
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.secret-box{display:none}
</style>
</head>
<body>
<header>
<svg class="logo" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#g)" stroke-width="1.5" fill="none"/><defs><linearGradient id="g"><stop offset="0" stop-color="#00f5ff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs></svg>
<h1>Golden Bot v3.0 Command Center</h1>
</header>

<div class="card">
  <h3><svg class="icon"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Connection</h3>
  <div class="grid grid-2">
    <input id="botUrl" placeholder="Bot Server URL" value="https://golden-bot.onrender.com">
    <input id="secret" class="secret-box" placeholder="ADMIN_SECRET_HASH" type="password">
  </div>
  <button onclick="checkHealth()"><svg class="icon"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Connect</button>
  <div id="status" style="margin-top:10px"></div>
</div>

<div class="grid grid-3">
  <div class="card"><h3><svg class="icon"><path d="M9 12l2 2 4-4"/></svg>System Health</h3><div id="health"><span class="pill">Not connected</span></div></div>
  <div class="card"><h3><svg class="icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/></svg>Profile</h3>
    <input id="profileId" value="sb1">
    <button class="btn-secondary" onclick="rotateProfile()">Rotate UA</button>
  </div>
  <div class="card"><h3><svg class="icon"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Quick Actions</h3>
    <div class="tool-grid">
      <button class="btn-secondary" onclick="quick('checkUnits')">Units</button>
      <button class="btn-secondary" onclick="quick('swagbucksCheck')">SB</button>
      <button class="btn-secondary" onclick="quick('timebucksFarm')">TB</button>
    </div>
  </div>
</div>

<div class="card">
  <h3><svg class="icon"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> AI Command Chat</h3>
  <div class="chat" id="chat"></div>
  <textarea id="command" rows="2" placeholder="With profile sb1 smartLogin to https://swagbucks.com/login email: a@b.com password: 123"></textarea>
  <div class="grid grid-2">
    <input id="userId" value="admin" placeholder="User ID">
    <button onclick="runCommand()">Send</button>
  </div>
</div>

<div class="card">
  <h3><svg class="icon"><path d="M4 6h16M4 12h16M4 18h7"/></svg> 1-Click Tools</h3>
  <div class="grid grid-3">
    <div>
      <h4 style="margin:0 0 8px;color:var(--muted)">Browser</h4>
      <input id="url" placeholder="https://example.com">
      <button onclick="tool('extractPageText')">Extract Text</button>
      <button class="btn-secondary" onclick="tool('takeScreenshot')">Screenshot</button>
      <button class="btn-secondary" onclick="tool('extractAllLinks')">Get Links</button>
    </div>
    <div>
      <h4 style="margin:0 0 8px;color:var(--muted)">Social</h4>
      <textarea id="postText" rows="3" placeholder="Post text"></textarea>
      <button onclick="tool('postToX')">Post to X</button>
      <button class="btn-secondary" onclick="tool('postToLinkedIn')">Post to LinkedIn</button>
    </div>
    <div>
      <h4 style="margin:0 0 8px;color:var(--muted)">Marketing</h4>
      <input id="website" placeholder="https://targetsite.com">
      <textarea id="pitch" rows="2" placeholder="Pitch"></textarea>
      <button onclick="tool('findContactAndPitch')">Find Email</button>
      <button class="btn-secondary" onclick="tool('findDealsAndCodes')">Promo Codes</button>
    </div>
  </div>
</div>

<div class="card">
  <h3><svg class="icon"><path d="M12 8v4l3 3"/></svg> Scheduler</h3>
  <textarea id="scheduleCmd" placeholder="With profile tb1 timebucksFarm"></textarea>
  <input id="scheduleTime" type="datetime-local">
  <button onclick="schedule()">Schedule Task</button>
  <div id="scheduleResult"></div>
</div>

<div class="card">
  <h3><svg class="icon"><path d="M12 15l-3-3m3 3l3-3m-3 3V4"/></svg> Captcha Solver</h3>
  <button class="btn-secondary" onclick="loadCaptchas()">Load Pending</button>
  <div id="captchaArea" style="margin-top:12px"></div>
</div>

<div class="card">
  <h3><svg class="icon"><path d="M3 3v18h18"/></svg> Audit Logs</h3>
  <button class="btn-secondary" onclick="loadLogs()">Load Last 20</button>
  <div class="logs" id="logs"></div>
</div>

<script>
const SECRET = "GDBT-7K9P-2Q4R-X8Z1"; 
let BOT_URL = "", CHAT = [];
window.onload = () => { document.getElementById('secret').value = SECRET; }

function addChat(role, text){
  CHAT.push({role, text});
  document.getElementById('chat').innerHTML = CHAT.map(m => 
    `<div class="${m.role==='user'?'msg-user':'msg-bot'}"><b>${m.role}:</b> <pre style="white-space:pre-wrap;margin:4px 0 0">${m.text}</pre></div>`
  ).join('');
  document.getElementById('chat').scrollTop = 99999;
}

async function api(path, body){
  const res = await fetch(`${BOT_URL}${path}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...body, secret:SECRET})
  });
  return res.json();
}

async function checkHealth(){
  BOT_URL = document.getElementById('botUrl').value;
  try{
    const res = await fetch(`${BOT_URL}/health?secret=${SECRET}`);
    const d = await res.json();
    document.getElementById('health').innerHTML = `
      <span class="pill"><svg class="icon" style="width:14px"><circle cx="12" cy="12" r="3"/></svg> Units: ${d.units}</span>
      <span class="pill">Acc ${d.account}</span>
      <span class="pill">AI $${d.dailyCost.toFixed(4)}</span>
      <span class="pill">Queue: ${d.queueLength}</span>
      <span class="pill" style="color:${d.browserConnected?'var(--ok)':'var(--danger)'}">Browser: ${d.browserConnected ? 'ON' : 'OFF'}</span>
    `;
    document.getElementById('status').innerHTML = `<span class="pill" style="color:var(--ok)">✓ Connected</span>`;
  }catch(e){ document.getElementById('status').innerHTML = `<span class="pill" style="color:var(--danger)">✗ Failed</span>`; }
}

async function runCommand(){
  const cmd = document.getElementById('command').value;
  const userId = document.getElementById('userId').value;
  if(!cmd) return;
  addChat('user', cmd);
  document.getElementById('command').value = '';
  const r = await api('/run', {command:cmd, userId});
  addChat('bot', 'Processing...');
  setTimeout(async () => {
    const res = await fetch(`${BOT_URL}/result/${r.jobId}?secret=${SECRET}`);
    const data = await res.json();
    CHAT.pop(); // remove processing
    addChat('bot', JSON.stringify(data.result, null, 2));
  }, 4000);
}

function quick(tool){
  const profile = document.getElementById('profileId').value || 'sb1';
  document.getElementById('command').value = `With profile ${profile} ${tool}`;
  runCommand();
}

function tool(toolName){
  const profile = document.getElementById('profileId').value || 'sb1';
  const url = document.getElementById('url').value;
  const text = document.getElementById('postText').value;
  const website = document.getElementById('website').value;
  const pitch = document.getElementById('pitch').value;
  let cmd = `With profile ${profile} `;
  if(toolName==='extractPageText') cmd += `extractPageText ${url}`;
  if(toolName==='takeScreenshot') cmd += `takeScreenshot ${url}`;
  if(toolName==='extractAllLinks') cmd += `extractAllLinks ${url}`;
  if(toolName==='postToX') cmd += `postToX "${text}"`;
  if(toolName==='postToLinkedIn') cmd += `postToLinkedIn "${text}"`;
  if(toolName==='findContactAndPitch') cmd += `findContactAndPitch ${website} "${pitch}"`;
  if(toolName==='findDealsAndCodes') cmd += `findDealsAndCodes ${website}`;
  document.getElementById('command').value = cmd;
  runCommand();
}

async function schedule(){
  const cmd = document.getElementById('scheduleCmd').value;
  const time = new Date(document.getElementById('scheduleTime').value).toISOString();
  const r = await api('/schedule', {command:cmd, runAt:time, userId:"admin"});
  document.getElementById('scheduleResult').innerHTML = `<span class="pill" style="color:var(--ok)">✓ Scheduled</span>`;
}

async function loadCaptchas(){
  const res = await fetch(`${BOT_URL}/captcha/pending?secret=${SECRET}`);
  const c = await res.json();
  document.getElementById('captchaArea').innerHTML = c.map(x => `
    <div class="card" style="margin-top:10px">
      <p style="font-size:12px;color:var(--muted)">Profile: ${x.profileId} | Job: ${x.job_id}</p>
      <img src="data:image/png;base64,${x.screenshot}" class="captcha-img">
      <input id="ans-${x.job_id}" placeholder="CLICK:#id or TYPE:ABC">
      <button onclick="solve('${x.job_id}')">Submit Answer</button>
    </div>
  `).join('') || "<span class='pill'>No pending captchas</span>";
}

async function solve(job_id){
  const ans = document.getElementById(`ans-${job_id}`).value;
  await api('/captcha/solve', {job_id, answer:ans});
  loadCaptchas();
}

async function rotateProfile(){
  const p = document.getElementById('profileId').value || 'sb1';
  document.getElementById('command').value = `With profile ${p} rotateBrowserProfile`;
  runCommand();
}

async function loadLogs(){
  document.getElementById('logs').innerText = "Query: SELECT * FROM universal_audit_logs ORDER BY id DESC LIMIT 20";
}

setInterval(checkHealth, 20000);
</script>
</body>
</html>
