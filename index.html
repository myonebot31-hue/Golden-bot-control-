<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GolViral Pro Sender</title>
<style>
*{box-sizing:border-box}
body{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;padding:0;margin:0;background:#0a0a0a;color:#fff}
.container{max-width:500px;margin:auto;padding:20px}
.header{text-align:center;padding:20px 0}
.header h1{margin:0;font-size:24px}
.header p{color:#888;font-size:13px}
.card{background:#1a1a1a;border-radius:16px;padding:16px;margin:12px 0;border:1px solid #2a2a2a}
label{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:1px;display:block;margin:12px 0 6px}
input,textarea{width:100%;padding:14px;background:#000;border:1px solid #333;border-radius:12px;color:#fff;font-size:14px;outline:none}
textarea{resize:none}
input:focus,textarea:focus{border-color:#25D366}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}
.btn-green{background:#25D366;color:#000}
.btn-black{background:#fff;color:#000;margin-top:8px}
.log{background:#000;border-radius:12px;padding:12px;height:200px;overflow:auto;font-family:monospace;font-size:12px;border:1px solid #222;margin-top:12px}
.tabs{display:flex;background:#1a1a1a;border-radius:12px;padding:4px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;color:#888;border-radius:8px;font-weight:600}
.tabs button.active{background:#fff;color:#000}
.counter{font-size:11px;color:#25D366;margin-top:6px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>GolViral Sender Pro</h1>
<p>Frontend Only • No Backend • Key Secured Inside</p>
</div>

<div class="tabs">
<button id="tEmail" class="active" onclick="setMode('email')">EMAIL BULK</button>
<button id="tSms" onclick="setMode('sms')">SMS PRO</button>
</div>

<div id="emailCard" class="card">
<label>Your Gmail (FormSubmit)</label>
<input id="myEmail" value="owlfitcat@sendapp.uk">

<label>Ad Subject</label>
<input id="subject" value="GolViral Daily - Earn N500 Today!">

<label>Edit Your Advertising Message</label>
<textarea id="adMessage" rows="4">Hello Champion! 🔥

GolViral Daily Offer is LIVE.
Earn N500 today — Limited slots!

👉 Visit: https://golviral.com
Reply STOP to unsubscribe.</textarea>

<label>Paste 85 Emails (one per line)</label>
<textarea id="emails" rows="8" placeholder="customer1@gmail.com&#10;customer2@gmail.com&#10;...85 emails"></textarea>
<div id="count" class="counter">0 emails detected</div>
</div>

<div id="smsCard" class="card" style="display:none">
<label>Target Phone (e.g. 2348012345678)</label>
<input id="phone" placeholder="234...">

<label>Edit SMS Advertising Message</label>
<textarea id="smsAd" rows="3">GolViral: Earn N500 today! Visit golviral.com STOP to optout</textarea>
<p style="font-size:11px;color:#666;margin-top:8px">Using your paid Textbelt key (hardcoded). 1 SMS = 1 credit.</p>
</div>

<button class="btn btn-green" onclick="sendNow()">🚀 SEND NOW</button>
<button class="btn btn-black" onclick="clearLog()">Clear Log</button>

<div id="log" class="log">Ready...<br>• Email mode = FormSubmit (free unlimited, no key)<br>• SMS mode = Textbelt (your paid key inside code)</div>
</div>

<script>
// HARDCODED KEY - Do not share this file publicly
const TEXTBELT_KEY = "2d395b21149d9a0de4e27e36945a85609457cc4awsAnlwnEv2dfsVDHDsbEV5ixj";

let mode='email';
function setMode(m){
 mode=m;
 document.getElementById('emailCard').style.display=m=='email'?'block':'none';
 document.getElementById('smsCard').style.display=m=='sms'?'block':'none';
 document.getElementById('tEmail').className=m=='email'?'active':'';
 document.getElementById('tSms').className=m=='sms'?'active':'';
}

document.getElementById('emails').addEventListener('input',()=>{
 const list=document.getElementById('emails').value.split('\n').filter(e=>e.includes('@'));
 document.getElementById('count').innerText=`${list.length} emails detected`;
});

async function sendNow(){
 const log=document.getElementById('log');
 if(mode=='email'){
   const myEmail=document.getElementById('myEmail').value.trim();
   const subject=document.getElementById('subject').value.trim();
   const msg=document.getElementById('adMessage').value.trim();
   const emails=document.getElementById('emails').value.split('\n').map(e=>e.trim()).filter(e=>e.includes('@'));
   if(!myEmail||!emails.length){alert('Enter Gmail and emails');return;}
   log.innerHTML+=`<br>Starting EMAIL bulk to ${emails.length}...<br>`;
   for(let i=0;i<emails.length;i++){
     log.innerHTML+=`[${i+1}/${emails.length}] ${emails[i]}... `;
     try{
       await fetch(`https://formsubmit.co/${myEmail}`,{
         method:'POST',
         headers:{'Content-Type':'application/json','Accept':'application/json'},
         body:JSON.stringify({email:emails[i],message:msg,_subject:subject,_captcha:'false',_template:'box'})
       });
       log.innerHTML+=`✅<br>`;
     }catch(e){log.innerHTML+=`❌<br>`;}
     await new Promise(r=>setTimeout(r,2000));
     log.scrollTop=log.scrollHeight;
   }
   log.innerHTML+=`<br><b>Done! ${emails.length} emails sent.</b><br>`;
 }else{
   const phone=document.getElementById('phone').value.trim();
   const sms=document.getElementById('smsAd').value.trim();
   if(!phone){alert('Enter phone');return;}
   log.innerHTML+=`<br>Sending SMS to ${phone}...<br>`;
   try{
     const res=await fetch('https://textbelt.com/text',{
       method:'POST',
       headers:{'Content-Type':'application/json'},
       body:JSON.stringify({phone:phone,message:sms,key:TEXTBELT_KEY})
     });
     const data=await res.json();
     log.innerHTML+=`Response: ${JSON.stringify(data)}<br>`;
     if(data.success) log.innerHTML+=`✅ SMS Delivered! ID: ${data.textId}<br>`;
     else log.innerHTML+=`❌ Failed: ${data.error}<br>`;
   }catch(e){log.innerHTML+=`❌ Error: ${e.message}<br>`;}
 }
}

function clearLog(){document.getElementById('log').innerHTML='Log cleared. Ready...<br>';}
</script>
</div>
</body>
</html>
