<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>GolViral Bulk Sender</title>
<script src="https://cdn.jsdelivr.net/npm/smtpjs@1.0.1/smtp.min.js"></script>
</head>
<body style="font-family:system-ui;padding:20px;background:#0f172a;color:white">
<div style="background:white;color:#1e293b;padding:20px;border-radius:16px;max-width:600px;margin:auto">
<h2 style="color:#4f46e5">GolViral Bulk Sender - 500/day</h2>
<p>From: Kelvinbackup89@gmail.com</p>

<input id="mypass" placeholder="Paste 16 letters App Password (no spaces)" style="width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px">
<input id="subj" value="GolViral Daily Update" style="width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px">
<textarea id="ad" style="width:100%;height:100px;padding:12px">Hello! GolViral new tasks live. Earn N500. Link: https://your-link.com</textarea>
<textarea id="emails" placeholder="customer@gmail.com" style="width:100%;height:120px;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px"></textarea>
<button onclick="sendBulk()" style="width:100%;padding:15px;background:#4f46e5;color:white;border:none;border-radius:8px;font-weight:bold">SEND NOW</button>
<div id="log" style="margin-top:12px;background:#f1f5f9;padding:10px;border-radius:8px;font-size:12px;color:black"></div>
</div>

<script>
const MY_GMAIL="Kelvinbackup89@gmail.com";
function sendBulk(){
 if(typeof Email==="undefined"){ alert("Email lib not loaded. Turn on data/WiFi and reload page. If on Airtel, use VPN."); return; }
 const mypass=document.getElementById('mypass').value.trim().replace(/\s/g,'');
 const subj=document.getElementById('subj').value;
 const ad=document.getElementById('ad').value;
 const emails=document.getElementById('emails').value.split('\n').map(e=>e.trim()).filter(e=>e.includes('@'));
 if(mypass.length<16){ alert("Paste App Password"); return; }
 document.getElementById('log').innerHTML="Sending...<br>";
 emails.forEach((to,i)=>{
  setTimeout(()=>{
   Email.send({Host:"smtp.gmail.com",Username:MY_GMAIL,Password:mypass,To:to,From:MY_GMAIL,Subject:subj,Body:ad}).then(msg=>{
    document.getElementById('log').innerHTML+=`${i+1}. ${to} -> ${msg}<br>`;
   });
  },i*2500);
 });
}
</script>
</body>
</html>
